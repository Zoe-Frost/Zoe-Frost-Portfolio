<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Lab — Zoe Frost</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --serif: 'Cormorant Garamond', Georgia, serif;
      --sans: 'Inter', -apple-system, sans-serif;
      --black: #0a0a0a;
      --white: #ffffff;
      --gray: #888888;
      --nav-h: 56px;
      --pad: 30px;
    }

    body { font-family: var(--sans); color: var(--black); background: var(--white); overflow-x: hidden; }

    /* ── NAV ── */
    nav {
      position: fixed; top: 0; left: 0; right: 0;
      height: calc(var(--nav-h) + 16px);
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px var(--pad) 0;
      background: rgba(255,255,255,0.96);
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      z-index: 100;
    }
    .logo { text-decoration: none; }
    .nav-links { display: flex; gap: 36px; list-style: none; }
    .nav-links li a { font-family: var(--sans); font-size: clamp(14px, 1.71vw, 24px); font-weight: 400; color: var(--black); text-decoration: none; transition: opacity 0.15s; }
    .nav-links li a:hover, .nav-links li a.active { text-decoration: underline; text-underline-offset: 4px; }

    /* ── PAGE WRAPPER ── */
    .page { padding: 0 var(--pad); padding-top: calc(var(--nav-h) + 16px); }

    /* ── HERO ── */
    .hero-section {
      position: relative;
      height: 100vh;
      padding-top: calc(var(--nav-h) + 16px);
      padding-bottom: 80px;
      display: flex;
      flex-direction: column;
    }
    .slider-wrapper {
      flex: 1;
      display: flex;
      align-items: center;
    }
    /* ── SLIDING STRIP ── */
    .hero-slider {
      overflow: hidden;
      height: clamp(180px, 28vw, 390px);
      flex-shrink: 0;
      margin-left: calc(-1 * var(--pad));
      margin-right: calc(-1 * var(--pad));
      width: calc(100% + var(--pad) * 2);
    }
    .hero-slider-track {
      display: flex;
      gap: 6px;
      animation: slideLeft 30s linear infinite;
      width: max-content;
    }
    .hero-slider.paused .hero-slider-track {
      animation-play-state: paused;
    }
    @keyframes slideLeft {
      0%   { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }
    .hero-slide-img {
      width: clamp(180px, 28vw, 390px);
      height: clamp(180px, 28vw, 390px);
      background-size: 110%;
      background-position: center;
      flex-shrink: 0;
      cursor: pointer;
    }
    .hero-title {
      font-family: var(--serif);
      font-weight: 400;
      font-size: clamp(52px, 9.1vw, 128px);
      line-height: 1.05;
      display: flex;
      align-items: center;
      gap: 20px;
    }
    .flask-icon {
      width: clamp(26px, 4.5vw, 64px);
      height: clamp(26px, 4.5vw, 64px);
      flex-shrink: 0;
    }

    /* ── INTRO ── */
    .intro-section {
      padding: clamp(80px, 16vw, 240px) 0 clamp(100px, 20vw, 300px);
    }
    .intro-body {
      font-family: var(--sans);
      font-size: clamp(18px, 3.43vw, 48px);
      font-weight: 400;
      line-height: 1.65;
      padding-left: clamp(26px, 3.8vw, 56px);
      position: relative;
    }
    .intro-body::before {
      content: '↳';
      position: absolute;
      left: 0;
      top: 2px;
      font-family: var(--sans);
      font-size: clamp(18px, 3.43vw, 48px);
      font-weight: 400;
    }

    /* ── LAB GRID ── */
    .lab-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: clamp(80px, 14vw, 200px);
      padding: clamp(60px, 9vw, 140px) clamp(60px, 10vw, 180px) clamp(160px, 18vw, 260px);
    }
    .lab-item { display: flex; flex-direction: column; gap: 14px; }
    .lab-img {
      aspect-ratio: 1 / 1;
      overflow: hidden;
      border-radius: 40px;
      clip-path: inset(0 round 40px);
      line-height: 0;
    }
    .lab-img img {
      width: 100%; height: 100%;
      display: block; object-fit: cover;
      transform: scale(1.08);
    }
    .lab-coming-soon {
      aspect-ratio: 1 / 1;
      background: var(--black);
      border-radius: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .lab-coming-soon span {
      font-family: var(--sans);
      font-size: clamp(13px, 1.3vw, 16px);
      font-weight: 400;
      color: rgba(255,255,255,0.65);
      letter-spacing: 0.01em;
    }
    .lab-meta {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }
    .lab-name {
      font-family: var(--sans);
      font-size: clamp(13px, 1.4vw, 17px);
      font-weight: 400;
      color: var(--black);
    }
    .lab-date {
      font-family: var(--sans);
      font-size: clamp(12px, 1.2vw, 15px);
      font-weight: 400;
      color: var(--black);
    }

    /* ── REVEAL ── */
    .reveal { opacity: 0; filter: brightness(0.2) blur(2px); transform: translateY(12px); transition: opacity 0.9s cubic-bezier(0.4,0,0.2,1), filter 0.9s cubic-bezier(0.4,0,0.2,1), transform 0.9s cubic-bezier(0.4,0,0.2,1); }
    .reveal.in-view { opacity: 1; filter: brightness(1) blur(0); transform: translateY(0); }

    /* ── FOOTER ── */
    footer { background: var(--black); color: var(--white); padding: 32px var(--pad) 28px; }
    .footer-inner { display: flex; justify-content: space-between; align-items: stretch; }
    .footer-nav { list-style: none; display: flex; flex-direction: column; gap: 10px; }
    .footer-nav li a { font-family: var(--sans); font-size: 14px; color: var(--white); text-decoration: none; transition: opacity 0.2s; }
    .footer-nav li a:hover { opacity: 0.45; }
    .footer-socials { display: flex; gap: 18px; align-items: center; align-self: flex-end; }
    .footer-socials a { color: var(--white); display: flex; align-items: center; opacity: 0.82; transition: opacity 0.2s; }
    .footer-socials a:hover { opacity: 1; }
    .social-icon { width: 20px; height: 20px; fill: currentColor; }
    .footer-copy { text-align: center; font-size: 11.5px; color: rgba(255,255,255,0.35); margin-top: 36px; }

    /* ── RESPONSIVE ── */
    @media (max-width: 900px) {
      :root { --pad: 24px; }
.lab-grid { gap: 16px; }
    }
    @media (max-width: 600px) {
      :root { --pad: 18px; }
      .hero-section { min-height: 70vh; }
      .lab-grid { grid-template-columns: 1fr; }
      .lab-img, .lab-coming-soon { border-radius: 24px; clip-path: inset(0 round 24px); }
    }
  </style>
</head>

  <script>
    // Slider pause on hover
    const slider = document.querySelector('.hero-slider');
    const slideImgs = slider.querySelectorAll('.hero-slide-img');
    slideImgs.forEach(img => {
      img.addEventListener('mouseenter', () => slider.classList.add('paused'));
      img.addEventListener('mouseleave', () => slider.classList.remove('paused'));
    });

    const revealObserver = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.intersectionRatio >= 0.15) entry.target.classList.add('in-view');
        else entry.target.classList.remove('in-view');
      });
    }, { threshold: [0, 0.1, 0.15, 0.3, 0.5] });
    document.querySelectorAll('.reveal').forEach(el => revealObserver.observe(el));
  </script>
